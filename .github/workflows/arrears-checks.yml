name: Arrears portfolio checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  synthetic-arrears-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Run synthetic financial-processing tests
        run: python -m unittest discover -s tests -v
      - name: Validate supplied demonstration workbook
        run: python -m arrears_engine.cli validate --config data/config.example.json
